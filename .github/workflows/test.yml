name: Test

# A pull request from a branch in this repository fires BOTH `push` and
# `pull_request`, so the previous `on: [push, pull_request]` ran the whole
# three-OS matrix twice for every commit -- measured on PR #1, runs
# 35399874779 and 35399906289 for one push. Restricting `push` to master keeps
# one run per commit on a branch and one per merge.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # staticcheck used to be installed @latest, which recompiled it from source on
  # every job and silently changed the lint surface whenever upstream released.
  # A pinned version means a new finding is our code changing, not the linter.
  STATICCHECK_VERSION: "2026.2.1"

jobs:
  test:
    name: Go tests
    strategy:
      fail-fast: false
      matrix:
        # `-latest` is a moving target and that is deliberate HERE: this matrix
        # exists to find out when a new runner image breaks us, and it is cheap
        # to fix a test job. release.yml pins its runner instead, because a
        # release build wants reproducibility rather than early warning.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Reads the `go` directive from go.mod, so CI builds on exactly the
          # floor the project claims to support. `go-version: 1.x` floated to
          # whatever was newest and therefore never tested that claim.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race ./...

      # Added once the last unsafe.Pointer finding was fixed. Before that vet
      # exited 1 on Windows, so it could not be a gate -- and a permanently red
      # check is worse than none, because the next real finding hides in it.
      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}

      - name: Run staticcheck
        run: staticcheck ./...

  # The one context the branch ruleset requires. The matrix above reports a
  # check per OS, so requiring those directly would tie the ruleset to the
  # matrix, and a required check that stops reporting blocks every merge.
  # `if: always()` makes this job report even when a matrix leg fails, and
  # `needs.test.result` is `success` only when every leg succeeded.
  build-and-test:
    name: build-and-test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling.
      #
      # Steps inside build-and-test rather than a job of their own: the ruleset
      # requires a check named exactly `build-and-test`, so a separate job would
      # not be required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to master the base is master itself, so there is nothing to scan.
      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        # The runner's own Python 3; the gate is stdlib-only.
        run: >-
          python3 .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Nothing later in this job reads the tree; removed so a step added
        # later cannot pick the gate's files up by accident.
        run: rm -rf .american-spelling

      - name: Require every Go tests job to have passed
        # `always()` so a spelling failure above does not hide the test verdict.
        if: always()
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Go tests finished as '$RESULT', not 'success'."
            exit 1
          fi
